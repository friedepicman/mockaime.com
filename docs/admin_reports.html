<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Problem Reports - Mock AIME Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.4/dist/umd/supabase.min.js"></script>
  

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        ignoreHtmlClass: 'no-mathjax',
        processHtmlClass: 'mathjax-render'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="admin.css">
  <script src="theme.js"></script>
  <link rel="icon" type="image/png" href="256px_transparentBG.png">
</head>
<body>
  <nav>
    <div>
      <a href="index.html" style="display: flex; align-items: center; gap: 12px;">
        <img src="256px_transparentBG.png" alt="Mock AIME Logo" style="height: 34px; width: auto;">
        Mock AIME
      </a>
      <div class="nav-links-right">
        <a href="index.html">Mock Test</a>
        <a href="search.html">Search</a>
        <a href="admin.html">Problems</a>
        <a href="admin_reports.html">Reports</a>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()">Light</button>
      </div>
    </div>
  </nav>

  <header class="ma-hero">
    <div class="ma-hero-inner">
      <div>
        <div class="ma-eyebrow">Admin</div>
        <h1>Problem reports</h1>
        <p class="ma-tagline">Reports from users and from the answer checker. Accepting an answer fix updates the problem's AIME answer.</p>
      </div>
    </div>
  </header>

  <main class="admin-wrap">
  <div class="stats-bar">
    <div class="stat-card pending">
      <div class="stat-number" id="pendingCount">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card agent">
      <div class="stat-number" id="agentCount">0</div>
      <div class="stat-label">Pending from answer checker</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="totalCount">0</div>
      <div class="stat-label">All reports</div>
    </div>
  </div>

  <div class="report-filters">
    <button class="chip active" data-src="all" onclick="setSourceFilter('all')">All</button>
    <button class="chip" data-src="user" onclick="setSourceFilter('user')">From users</button>
    <button class="chip" data-src="agent" onclick="setSourceFilter('agent')">From answer checker</button>
    <span class="spacer"></span>
    <label class="checkbox-label">
      <input type="checkbox" id="showHandledCheckbox" onchange="toggleShowHandled()">
      Show handled
    </label>
  </div>

  <div id="reportsContainer">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p style="margin-top: 16px;">Loading reports...</p>
    </div>
  </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ftdbplxkyaocyrjpmjyb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0ZGJwbHhreWFvY3lyanBtanliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIxMDgxMDUsImV4cCI6MjA2NzY4NDEwNX0.hE0V09JxdLYNbZqPVH3HZxNpLPP2rXIaBsNGUHO3upc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleDarkMode() {
      const html = document.documentElement;
      const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', t);
      try { localStorage.setItem('theme', t); } catch (e) {}
      document.querySelector('.dark-mode-toggle').textContent = t === 'dark' ? 'Light' : 'Dark';
    }
    (function () {
      let t = 'dark';
      try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      document.addEventListener('DOMContentLoaded', () => {
        const b = document.querySelector('.dark-mode-toggle');
        if (b) b.textContent = t === 'dark' ? 'Light' : 'Dark';
      });
    })();
    // Admin auth check - redirects non-admins immediately
    const ADMIN_UUID = '6af62d68-67e7-42f6-b91f-58cac9d81cba';
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session || session.user.id !== ADMIN_UUID) {
        window.location.href = '404.html';
      }
    })();
    let allReports = [];
    let allProblems = {};
    let expandedReportId = null;
    let showHandled = false;
    let sourceFilter = 'all';

    function parseDetails(report) {
      try { return JSON.parse(report.details || '{}') || {}; } catch (e) { return {}; }
    }
    function isAgentReport(report) {
      return parseDetails(report).source === 'answer_checker';
    }
    function setSourceFilter(src) {
      sourceFilter = src;
      document.querySelectorAll('.report-filters .chip').forEach(c => c.classList.toggle('active', c.dataset.src === src));
      expandedReportId = null;
      renderReports();
    }

    window.onload = async () => {
      await loadReports();
    };

    function escapeHtml(text) {
      if (!text) return text;
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setMathContent(element, content) {
      if (!content) {
        element.innerHTML = '<em>No content</em>';
        return;
      }
      element.textContent = content;
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([element]).catch(err => console.error('MathJax error:', err));
      }
    }

    async function loadReports() {
      const container = document.getElementById('reportsContainer');
      container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p style="margin-top: 16px;">Loading reports...</p></div>';

      try {
        const { data, error } = await supabaseClient
          .from('problem_reports')
          .select('*')
          .order('created_at', { ascending: true }); // Oldest first

        if (error) throw error;

        allReports = data || [];
        
        // Load all problems referenced in reports
        const problemIds = [...new Set(allReports.map(r => r.problem_id))];
        if (problemIds.length > 0) {
          const { data: problems, error: pError } = await supabaseClient
            .from('problems')
            .select('*')
            .in('id', problemIds);
          
          if (!pError) {
            allProblems = {};
            problems.forEach(p => {
              allProblems[p.id] = p;
            });
          }
        }

        updateStats();
        renderReports();
      } catch (err) {
        console.error('Error loading reports:', err);
        container.innerHTML = '<div class="no-reports"><div class="no-reports-icon"></div><h2>Error Loading Reports</h2></div>';
      }
    }

    function updateStats() {
      const pendingReports = allReports.filter(r => !r.handled);
      document.getElementById('pendingCount').textContent = pendingReports.length;
      document.getElementById('totalCount').textContent = allReports.length;
      document.getElementById('agentCount').textContent = pendingReports.filter(isAgentReport).length;
    }

    function renderReports() {
      const container = document.getElementById('reportsContainer');

      // Filter reports based on showHandled
      let reportsToShow = showHandled ? allReports : allReports.filter(r => !r.handled);
      if (sourceFilter === 'agent') reportsToShow = reportsToShow.filter(isAgentReport);
      if (sourceFilter === 'user') reportsToShow = reportsToShow.filter(r => !isAgentReport(r));

      if (reportsToShow.length === 0) {
        const message = showHandled 
          ? '<div class="no-reports"><div class="no-reports-icon"></div><h2>No Reports</h2><p>There are no reports in the system.</p></div>'
          : '<div class="no-reports"><div class="no-reports-icon"></div><h2>All Clear!</h2><p>No pending reports to review.</p></div>';
        container.innerHTML = message;
        return;
      }

      container.innerHTML = reportsToShow.map(report => {
        if (expandedReportId === report.id) {
          return renderExpandedReport(report);
        } else {
          return renderCollapsedReport(report);
        }
      }).join('');

      // Re-render MathJax
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise().catch(err => console.error('MathJax error:', err));
      }
    }

    function toggleShowHandled() {
      showHandled = document.getElementById('showHandledCheckbox').checked;
      expandedReportId = null; // Close any expanded report
      renderReports();
    }

    function renderCollapsedReport(report) {
      const types = report.report_type.split(',');
      const date = new Date(report.created_at).toLocaleDateString();
      const isHandled = report.handled;
      const agent = isAgentReport(report);
      const details = parseDetails(report);
      const problem = allProblems[report.problem_id];

      const typeBadges = types.map(type => `<span class="type-badge ${type}">${type.replace('_', ' ')}</span>`).join('');
      const srcBadge = agent ? '<span class="src-badge agent">Answer checker</span>' : '';
      const handledBadge = isHandled ? '<span class="src-badge handled">Handled</span>' : '';
      let snippet = '';
      if (agent && details.agent) {
        snippet = `${details.agent.verdict.replace(/_/g, ' ')}: stored ${problem ? (problem.aime_answer ?? '?') : '?'}${details.proposed_answer ? ', should be ' + details.proposed_answer : ''}`;
      } else if (problem) {
        snippet = problem.source || '';
      }

      return `
        <div class="report-collapsed ${isHandled ? 'is-handled' : ''} ${agent ? 'is-agent' : ''}" onclick="expandReport(${report.id})">
          <div class="report-collapsed-header">
            <div class="report-collapsed-left">
              <div class="report-id-badge">#${report.id}</div>
              ${srcBadge}${handledBadge}
              <div class="report-types-compact">${typeBadges}</div>
              <span class="report-snippet">${escapeHtml(snippet) || ''}</span>
            </div>
            <div class="report-date-small">Problem ${report.problem_id} · ${date}</div>
          </div>
        </div>
      `;
    }

    function expandReport(reportId) {
      expandedReportId = reportId;
      renderReports();
      
      // Populate content after render
      setTimeout(() => {
        const report = allReports.find(r => r.id === reportId);
        if (!report) return;

        const problem = allProblems[report.problem_id];
        if (!problem) return;

        const originalRender = document.getElementById(`original-render-${problem.id}`);
        const rewrittenRender = document.getElementById(`rewritten-render-${problem.id}`);
        const originalTextarea = document.getElementById(`raw-original-${problem.id}`);
        const rewrittenTextarea = document.getElementById(`raw-rewritten-${problem.id}`);

        if (originalRender) setMathContent(originalRender, problem.text || '');
        if (rewrittenRender) setMathContent(rewrittenRender, problem.rewritten_problem || '');
        if (originalTextarea) originalTextarea.value = problem.text || '';
        if (rewrittenTextarea) rewrittenTextarea.value = problem.rewritten_problem || '';
        
        // Populate proposed problem text if it exists
        const details = JSON.parse(report.details || '{}');
        if (details.proposed_problem) {
          const proposedProblemRender = document.getElementById(`proposed-problem-${reportId}`);
          if (proposedProblemRender) {
            setMathContent(proposedProblemRender, details.proposed_problem);
          }
        }
        
        // Force MathJax render
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise().catch(err => console.error('MathJax error:', err));
        }
      }, 300);
    }

    function closeReport() {
      expandedReportId = null;
      renderReports();
    }

    function renderExpandedReport(report) {
      const problem = allProblems[report.problem_id];
      if (!problem) return '<div>Problem not found</div>';

      const details = JSON.parse(report.details || '{}');
      const types = report.report_type.split(',');
      const date = new Date(report.created_at).toLocaleString();
      const isHandled = report.handled;

      const qualityClass = `quality-${problem.quality || 0}`;
      const reviewedClass = problem.manually_reviewed ? 'reviewed' : '';
      const disabledAttr = isHandled ? 'disabled' : '';
      const readonlyAttr = isHandled ? 'readonly' : '';
      const handledStyle = isHandled ? 'opacity: 0.6; pointer-events: none;' : '';

      return `
        <div class="report-expanded ${isHandled ? 'is-handled' : ''}">
          <div class="report-expanded-header">
            <div>
              <h2>Report #${report.id} ${isAgentReport(report) ? '<span class="src-badge agent">Answer checker</span>' : ''} ${isHandled ? '<span class="src-badge handled">Handled</span>' : ''}</h2>
              <div class="meta">${date} · problem ${problem.id}</div>
            </div>
            <button class="close-report-btn" onclick="closeReport()">Close</button>
          </div>

          <div class="problem-editor-section" style="${handledStyle}">
            <div class="section-title">Problem #${problem.id}</div>
            
            <div class="problem-card ${qualityClass} ${reviewedClass}" id="problem-${problem.id}">
              <div class="problem-header">
                <div class="header-left">
                  <span class="problem-id">Problem ID: ${problem.id}</span>
                  <div class="quality-rating">
                    <span class="quality-label">Quality:</span>
                    <div class="stars" id="stars-${problem.id}">
                      ${renderStars(problem.id, problem.quality)}
                    </div>
                    <span style="color: var(--text-tertiary); font-size: 14px;">(${problem.quality || 0}/5)</span>
                  </div>
                </div>
                <div class="header-right">
                  <label class="checkbox-label">
                    <input type="checkbox" 
                           ${problem.manually_reviewed ? 'checked' : ''} 
                           ${disabledAttr}
                           onchange="updateReviewStatus(${problem.id}, this.checked)">
                    Manually Reviewed
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" 
                           ${problem.finalized ? 'checked' : ''} 
                           ${disabledAttr}
                           onchange="updateFinalizedStatus(${problem.id}, this.checked)">
                    Finalized
                  </label>
                </div>
              </div>
              
              <button class="toggle-raw-btn" ${disabledAttr} id="toggle-original-btn-${problem.id}" onclick="toggleOriginalSection(${problem.id})">Show Original Problem</button>
              
              <div class="original-section" id="original-section-${problem.id}">
                <div class="section-label">Original Problem Statement:</div>
                <div class="rendered-problem mathjax-render" id="original-render-${problem.id}"></div>
                <button class="toggle-raw-btn" ${disabledAttr} style="margin-top: 10px;" id="toggle-original-raw-btn-${problem.id}" onclick="toggleRawText(${problem.id}, 'original')">Show Raw Text</button>
                <textarea class="raw-textarea" ${readonlyAttr} id="raw-original-${problem.id}" onblur="saveProblemText(${problem.id})"></textarea>
              </div>
              
              <div class="rewritten-section">
                <div class="section-label">Rewritten Problem (AIME Format):</div>
                <div class="rendered-problem mathjax-render" id="rewritten-render-${problem.id}"></div>
                <button class="toggle-raw-btn" ${disabledAttr} style="margin-top: 10px;" id="toggle-rewritten-btn-${problem.id}" onclick="toggleRawText(${problem.id}, 'rewritten')">Show Raw Text</button>
                <textarea class="raw-textarea" ${readonlyAttr} id="raw-rewritten-${problem.id}" onblur="saveRewrittenProblem(${problem.id})"></textarea>
              </div>
              
              <div class="fields-row">
                <div class="field-group">
                  <label title="Answer to the original source problem">Original answer</label>
                  <input type="text" ${readonlyAttr} id="answer-${problem.id}" value="${escapeHtml(problem.answer || '')}" onblur="saveProblem(${problem.id})" style="width: 140px;" />
                </div>
                
                <div class="field-group">
                  <label>AIME answer</label>
                  <input type="text" ${readonlyAttr} id="aime-answer-${problem.id}" value="${problem.aime_answer || ''}" onblur="saveProblem(${problem.id})" style="width: 100px;" />
                </div>
                
                <div class="field-group">
                  <label>Difficulty</label>
                  <input type="text" ${readonlyAttr} id="difficulty-${problem.id}" value="${problem.difficulty || ''}" onblur="saveProblem(${problem.id})" style="width: 80px;" />
                </div>
                
                <div class="field-group">
                  <label>Type</label>
                  <select id="type-${problem.id}" ${disabledAttr} onchange="saveProblem(${problem.id})" style="min-width: 130px;">
                    <option value="" ${!problem.type ? 'selected' : ''}>None</option>
                    <option value="algebra" ${problem.type === 'algebra' ? 'selected' : ''}>Algebra</option>
                    <option value="geometry" ${problem.type === 'geometry' ? 'selected' : ''}>Geometry</option>
                    <option value="number_theory" ${problem.type === 'number_theory' ? 'selected' : ''}>Number Theory</option>
                    <option value="counting" ${problem.type === 'counting' ? 'selected' : ''}>Counting</option>
                    <option value="other" ${problem.type === 'other' ? 'selected' : ''}>Other</option>
                  </select>
                </div>
                
                <div class="field-group">
                  <label>Source</label>
                  <input type="text" ${readonlyAttr} id="source-${problem.id}" value="${escapeHtml(problem.source || '')}" onblur="saveProblem(${problem.id})" style="width: 250px;" />
                </div>
              </div>
              
              <div style="margin-top: 5px;">
                <span class="field-label" style="display: inline;">Link</span>
                <a href="${escapeHtml(problem.link || '#')}" target="_blank" class="link">${problem.link || 'No link'}</a>
              </div>
              
              <div style="margin-top: 10px;">
                <button ${disabledAttr} onclick="saveProblem(${problem.id})">Save Changes</button>
                <span class="save-status" id="status-${problem.id}"></span>
              </div>
            </div>
          </div>

          <div class="proposed-changes-section" style="${handledStyle}">
            <div class="section-title">Proposed changes</div>
            ${renderProposedChanges(report, problem, details, types, isHandled)}
          </div>

          ${isHandled ? '' : `
          <div class="mark-handled-section">
            <div class="grow">
              <strong>Done reviewing this report?</strong>
              <div class="sub">Mark it handled to remove it from the pending list.</div>
              ${report.user_id ? `
              <label class="field-label" style="display: block; margin: 12px 0 0;">Message to reporter (optional)</label>
              <textarea id="handledMsg-${report.id}" placeholder="Add a personal note, e.g. 'Fixed the answer' or 'Good catch on the typo!'" style="min-height: 60px;"></textarea>` : ''}
            </div>
            <button class="btn-mark-handled" onclick="markReportHandled(${report.id})">
              Mark as Handled
            </button>
          </div>
          `}
        </div>
      `;
    }

    function renderProposedChanges(report, problem, details, types, isHandled) {
      let changesHTML = '';
      const disabledAttr = isHandled ? 'disabled' : '';

      // Quality
      if (types.includes('quality') && details.quality_rating) {
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">Quality Rating: ${details.quality_rating}/5</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptQuality(event, ${problem.id}, ${details.quality_rating})">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Current:</strong> ${problem.quality || 0}/5</div>
              <div class="change-detail"><strong>Proposed:</strong> ${details.quality_rating}/5</div>
              ${details.quality_details ? `<div class="change-detail"><strong>Reason:</strong> ${escapeHtml(details.quality_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Difficulty
      if (types.includes('difficulty') && details.difficulty_rating) {
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">Difficulty Rating: ${details.difficulty_rating}</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptDifficulty(event, ${problem.id}, ${details.difficulty_rating})">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Current:</strong> ${problem.difficulty || 'Not set'}</div>
              <div class="change-detail"><strong>Proposed:</strong> ${details.difficulty_rating}</div>
              ${details.difficulty_details ? `<div class="change-detail"><strong>Reason:</strong> ${escapeHtml(details.difficulty_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Answer checker findings
      if (details.source === 'answer_checker' && details.agent) {
        const ag = details.agent;
        changesHTML += `
          <div class="change-card agent">
            <div class="change-header">
              <div class="change-title">Answer checker <span class="verdict ${escapeHtml(ag.verdict)}">${escapeHtml(ag.verdict.replace(/_/g, ' '))}</span></div>
              <div class="change-detail" style="margin: 0;">confidence: <strong>${escapeHtml(ag.confidence || '?')}</strong></div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Original answer (per source):</strong> ${escapeHtml(ag.original_answer || '?')} <span style="color: var(--text-tertiary);">(${escapeHtml(ag.original_answer_basis || '')}${ag.sources_agree === false ? ', sources disagree' : ''})</span></div>
              <div class="change-detail"><strong>Stored AIME answer:</strong> ${problem.aime_answer ?? 'Not set'}</div>
              <div class="change-detail"><strong>Expected AIME answer:</strong> ${escapeHtml(ag.expected_aime_answer || 'unknown')}</div>
              <div class="change-detail"><strong>Notes:</strong> ${escapeHtml(ag.notes || '')}</div>
              ${ag.model ? `<div class="change-detail" style="color: var(--text-tertiary); font-size: 12px;">${escapeHtml(ag.model)} · ${escapeHtml(ag.checked_at || '')}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Wrong Answer: users submit the AIME answer to the rewritten problem, so this only touches aime_answer
      if (types.includes('wrong_answer') && details.proposed_answer) {
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">New AIME answer: ${escapeHtml(details.proposed_answer)}</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptAnswer(event, ${problem.id}, ${report.id})">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Current AIME answer:</strong> ${problem.aime_answer ?? 'Not set'}</div>
              <div class="change-detail"><strong>Proposed AIME answer:</strong> ${escapeHtml(details.proposed_answer)}</div>
              <div class="change-detail" style="color: var(--text-tertiary);">Original answer (unchanged): ${escapeHtml(problem.answer || 'Not set')}</div>
              ${details.answer_details ? `<div class="change-detail"><strong>Reason:</strong> ${escapeHtml(details.answer_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Problem Statement
      if (types.includes('problem_statement')) {
        const proposedProblemId = `proposed-problem-${report.id}`;
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">Problem Statement Changes</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptProblemStatement(event, ${problem.id}, ${report.id})">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              ${details.proposed_problem ? `
                <div class="change-detail">
                  <strong>New Problem Text (Rendered):</strong>
                  <div class="rendered-problem mathjax-render" id="${proposedProblemId}" style="margin-top: 10px;"></div>
                  <button class="toggle-raw-btn" style="margin-top: 10px;" onclick="toggleElement('${proposedProblemId}-raw')">Show Raw Text</button>
                  <textarea id="${proposedProblemId}-raw" readonly style="width: 100%; min-height: 80px; display: none; margin-top: 10px;">${escapeHtml(details.proposed_problem)}</textarea>
                </div>
              ` : ''}
              ${details.proposed_problem_answer ? `<div class="change-detail"><strong>New AIME answer:</strong> ${escapeHtml(details.proposed_problem_answer)}</div>` : ''}
              ${details.problem_details ? `<div class="change-detail"><strong>Reason:</strong> ${escapeHtml(details.problem_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Source
      if (types.includes('source') && details.proposed_source) {
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">Source: ${escapeHtml(details.proposed_source)}</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptSource(event, ${problem.id}, '${escapeHtml(details.proposed_source)}')">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Current:</strong> ${problem.source || 'Not set'}</div>
              <div class="change-detail"><strong>Proposed:</strong> ${escapeHtml(details.proposed_source)}</div>
              ${details.source_details ? `<div class="change-detail"><strong>Details:</strong> ${escapeHtml(details.source_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      // Wrong Type
      if (types.includes('wrong_type') && details.proposed_type) {
        const typeLabels = { algebra: 'Algebra', geometry: 'Geometry', number_theory: 'Number Theory', counting: 'Counting', other: 'Other' };
        const currentTypeLabel = typeLabels[problem.type] || 'Not set';
        const proposedTypeLabel = typeLabels[details.proposed_type] || details.proposed_type;
        changesHTML += `
          <div class="change-card">
            <div class="change-header">
              <div class="change-title">Problem Type: ${proposedTypeLabel}</div>
              <div class="change-actions">
                <button class="btn-accept" ${disabledAttr} onclick="acceptType(event, ${problem.id}, '${details.proposed_type}')">Accept</button>
                <button class="btn-reject" ${disabledAttr} onclick="rejectChange(event)">Reject</button>
              </div>
            </div>
            <div class="change-content">
              <div class="change-detail"><strong>Current:</strong> ${currentTypeLabel}</div>
              <div class="change-detail"><strong>Proposed:</strong> ${proposedTypeLabel}</div>
              ${details.type_details ? `<div class="change-detail"><strong>Reason:</strong> ${escapeHtml(details.type_details)}</div>` : ''}
            </div>
          </div>
        `;
      }

      return changesHTML || '<p style="color: var(--text-tertiary); margin: 0;">No specific changes proposed.</p>';
    }

    function toggleOriginalSection(problemId) {
      const section = document.getElementById(`original-section-${problemId}`);
      const btn = document.getElementById(`toggle-original-btn-${problemId}`);
      
      if (section.classList.contains('show')) {
        section.classList.remove('show');
        btn.textContent = 'Show Original Problem';
      } else {
        section.classList.add('show');
        btn.textContent = 'Hide Original Problem';
        
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise([section]).catch(err => console.error('MathJax error:', err));
        }
      }
    }

    // Add this new function
    function rejectChange(event) {
    event.target.closest('.change-card').style.display = 'none';
    }

    function renderStars(problemId, currentQuality) {
      const quality = currentQuality || 0;
      let starsHTML = '';
      
      for (let i = 1; i <= 5; i++) {
        const filled = i <= quality ? 'filled' : '';
        starsHTML += `<span class="star ${filled}" data-rating="${i}">★</span>`;
      }
      
      return starsHTML;
    }

    function toggleRawText(problemId, type) {
      const textarea = document.getElementById(`raw-${type}-${problemId}`);
      const btn = document.getElementById(`toggle-${type}-raw-btn-${problemId}`);
      
      if (textarea.classList.contains('show')) {
        textarea.classList.remove('show');
        btn.textContent = 'Show Raw Text';
      } else {
        textarea.classList.add('show');
        btn.textContent = 'Hide Raw Text';
      }
    }

    function toggleElement(elementId) {
      const element = document.getElementById(elementId);
      const btn = event.target;
      
      if (element.style.display === 'none') {
        element.style.display = 'block';
        btn.textContent = 'Hide Raw Text';
      } else {
        element.style.display = 'none';
        btn.textContent = 'Show Raw Text';
      }
    }

    async function setQuality(problemId, quality) {
      const { data, error } = await supabaseClient
        .from('problems')
        .update({ quality: quality })
        .eq('id', problemId)
        .select();
      
      if (error) {
        console.error('Error updating quality:', error);
        alert('Failed to update quality');
      } else {
        allProblems[problemId].quality = quality;
        
        const starsContainer = document.getElementById(`stars-${problemId}`);
        if (starsContainer) {
          starsContainer.innerHTML = renderStars(problemId, quality);
        }
        
        const card = document.getElementById(`problem-${problemId}`);
        if (card) {
          for (let i = 0; i <= 5; i++) {
            card.classList.remove(`quality-${i}`);
          }
          card.classList.add(`quality-${quality}`);
        }

        showSaveStatus(problemId, 'Quality updated');
      }
    }

    // Star interaction handlers
    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('star')) {
        const starsContainer = e.target.parentElement;
        const problemId = starsContainer.id.replace('stars-', '');
        const rating = parseInt(e.target.getAttribute('data-rating'));
        setQuality(problemId, rating);
      }
    });

    document.addEventListener('mouseenter', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('star')) {
        const rating = parseInt(e.target.getAttribute('data-rating'));
        const starsContainer = e.target.parentElement;
        const allStars = starsContainer.querySelectorAll('.star');
        
        allStars.forEach((star, index) => {
          star.classList.remove('hover');
          if (index < rating) {
            star.classList.add('hover');
          }
        });
      }
    }, true);

    document.addEventListener('mouseleave', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('star')) {
        const starsContainer = e.target.parentElement;
        const allStars = starsContainer.querySelectorAll('.star');
        allStars.forEach(star => star.classList.remove('hover'));
      }
    }, true);

    async function saveRewrittenProblem(problemId) {
      const text = document.getElementById(`raw-rewritten-${problemId}`).value;
      
      const { data, error } = await supabaseClient
        .from('problems')
        .update({ rewritten_problem: text })
        .eq('id', problemId)
        .select();
      
      if (error) {
        console.error('Error saving rewritten problem:', error);
        showSaveStatus(problemId, `Error: ${error.message}`, true);
      } else {
        allProblems[problemId].rewritten_problem = text;
        
        const renderDiv = document.getElementById(`rewritten-render-${problemId}`);
        if (renderDiv) {
          setMathContent(renderDiv, text);
        }
        
        showSaveStatus(problemId, 'Rewritten problem saved');
      }
    }

    async function saveProblemText(problemId) {
      const text = document.getElementById(`raw-original-${problemId}`).value;
      
      const { data, error } = await supabaseClient
        .from('problems')
        .update({ text })
        .eq('id', problemId)
        .select();
      
      if (error) {
        console.error('Error saving text:', error);
        showSaveStatus(problemId, `Error: ${error.message}`, true);
      } else {
        allProblems[problemId].text = text;
        
        const renderDiv = document.getElementById(`original-render-${problemId}`);
        if (renderDiv) {
          setMathContent(renderDiv, text);
        }
        
        showSaveStatus(problemId, 'Text saved');
      }
    }

    async function saveProblem(problemId) {
      const answer = document.getElementById(`answer-${problemId}`).value;
      const aimeAnswer = document.getElementById(`aime-answer-${problemId}`).value;
      const difficulty = document.getElementById(`difficulty-${problemId}`).value;
      const source = document.getElementById(`source-${problemId}`).value;
      const type = document.getElementById(`type-${problemId}`).value;
      
      const updateData = {
        answer,
        source,
        type: type || null,
        aime_answer: aimeAnswer ? parseInt(aimeAnswer) : null,
        difficulty: difficulty ? parseFloat(difficulty) : null
      };
      
      const { data, error } = await supabaseClient
        .from('problems')
        .update(updateData)
        .eq('id', problemId)
        .select();
      
      if (error) {
        console.error('Error saving problem:', error);
        showSaveStatus(problemId, `Error: ${error.message}`, true);
      } else {
        Object.assign(allProblems[problemId], updateData);
        showSaveStatus(problemId, 'Changes saved');
      }
    }

    async function updateReviewStatus(problemId, isReviewed) {
      const { error } = await supabaseClient
        .from('problems')
        .update({ manually_reviewed: isReviewed })
        .eq('id', problemId);
      
      if (error) {
        console.error('Error updating review status:', error);
        alert('Failed to update review status');
      } else {
        allProblems[problemId].manually_reviewed = isReviewed;
        
        const card = document.getElementById(`problem-${problemId}`);
        if (card) {
          if (isReviewed) {
            card.classList.add('reviewed');
          } else {
            card.classList.remove('reviewed');
          }
        }
        
        showSaveStatus(problemId, 'Review status updated');
      }
    }

    async function updateFinalizedStatus(problemId, isFinalized) {
      const { error } = await supabaseClient
        .from('problems')
        .update({ finalized: isFinalized })
        .eq('id', problemId);
      
      if (error) {
        console.error('Error updating finalized status:', error);
        alert('Failed to update finalized status');
      } else {
        allProblems[problemId].finalized = isFinalized;
        showSaveStatus(problemId, 'Finalized status updated');
      }
    }

    function showSaveStatus(problemId, message, isError = false) {
      const statusEl = document.getElementById(`status-${problemId}`);
      if (statusEl) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? 'var(--bad)' : 'var(--ok)';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      }
    }

    // Accept change functions - pass event and hide cards
    async function acceptQuality(event, problemId, quality) {
        await setQuality(problemId, quality);
        // Hide the change card
        event.target.closest('.change-card').style.display = 'none';
    }

    async function acceptDifficulty(event, problemId, difficulty) {
        document.getElementById(`difficulty-${problemId}`).value = difficulty;
        await saveProblem(problemId);
        // Hide the change card
        event.target.closest('.change-card').style.display = 'none';
    }

    // Reports carry a new AIME answer (the answer to the rewritten problem).
    // Only aime_answer changes; `answer` stays the original problem's answer.
    async function setAimeAnswer(problemId, value) {
        const num = parseInt(String(value).trim(), 10);
        if (isNaN(num)) {
            showSaveStatus(problemId, `"${value}" is not an integer AIME answer`, true);
            return false;
        }
        const { error } = await supabaseClient
            .from('problems')
            .update({ aime_answer: num })
            .eq('id', problemId);
        if (error) {
            console.error('Error saving AIME answer:', error);
            showSaveStatus(problemId, `Error: ${error.message}`, true);
            return false;
        }
        allProblems[problemId].aime_answer = num;
        const input = document.getElementById(`aime-answer-${problemId}`);
        if (input) input.value = num;
        showSaveStatus(problemId, 'AIME answer updated');
        return true;
    }

    async function acceptAnswer(event, problemId, reportId) {
        const card = event.target.closest('.change-card');
        const report = allReports.find(r => r.id === reportId);
        const details = parseDetails(report);
        if (!(await setAimeAnswer(problemId, details.proposed_answer))) return;
        // Hide the change card
        card.style.display = 'none';
    }

    async function acceptProblemStatement(event, problemId, reportId) {
        const report = allReports.find(r => r.id === reportId);
        const details = JSON.parse(report.details || '{}');
        
        if (details.proposed_problem) {
            document.getElementById(`raw-rewritten-${problemId}`).value = details.proposed_problem;
            await saveRewrittenProblem(problemId);
        }
        
        if (details.proposed_problem_answer) {
            await setAimeAnswer(problemId, details.proposed_problem_answer);
        }
        
        // Hide the change card
        event.target.closest('.change-card').style.display = 'none';
    }

    async function acceptSource(event, problemId, source) {
        document.getElementById(`source-${problemId}`).value = source;
        await saveProblem(problemId);
        // Hide the change card
        event.target.closest('.change-card').style.display = 'none';
    }

    async function acceptType(event, problemId, type) {
        document.getElementById(`type-${problemId}`).value = type;
        await saveProblem(problemId);
        // Hide the change card
        event.target.closest('.change-card').style.display = 'none';
    }

    async function markReportHandled(reportId) {
        try {
            // Get the report to find the user_id and problem_id
            const report = allReports.find(r => r.id === reportId);
            
            // Get custom message if any
            const customMsgEl = document.getElementById(`handledMsg-${reportId}`);
            const customMsg = customMsgEl ? customMsgEl.value.trim() : '';
            
            const { error } = await supabaseClient
            .from('problem_reports')
            .update({ 
                handled: true,
                handled_at: new Date().toISOString()
            })
            .eq('id', reportId);

            if (error) throw error;

            // Send message to the reporter if they were logged in
            if (report && report.user_id) {
                const problemId = report.problem_id;
                const problem = allProblems[problemId];
                const problemSource = problem?.source || `Problem #${problemId}`;
                
                // Build message body
                let messageBody = `Thanks for reporting an issue with "${problemSource}"!`;
                if (customMsg) {
                    messageBody += `\n\n${customMsg}`;
                }
                
                try {
                    await supabaseClient
                        .from('user_messages')
                        .insert({
                            user_id: report.user_id,
                            title: 'Your report was reviewed',
                            body: messageBody,
                            message_type: 'report_update',
                            metadata: { problem_id: problemId, report_id: reportId }
                        });
                } catch (msgErr) {
                    console.error('Error sending message to reporter:', msgErr);
                    // Don't fail the whole operation if message fails
                }
            }

            // Remove from local array and re-render (no alert)
            allReports = allReports.filter(r => r.id !== reportId);
            expandedReportId = null;
            updateStats();
            renderReports();
        } catch (err) {
            console.error('Error marking report as handled:', err);
            // Keep alert only for errors
            alert('Failed to mark report as handled.');
        }
    }
  </script>
</body>
</html>
